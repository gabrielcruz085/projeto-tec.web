<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Biblioteca de Jogos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">🎮 GameLibrary</div>
      <ul class="nav-links">
        <li><a href="index.html">Início</a></li>
        <li><a href="sobre.html">Sobre</a></li>
        <li><a href="login.html" class="active">Login</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <section class="login-container">
      <h2>Área de Membro</h2>
      <p>Acesse sua conta para salvar platinas e personalizar sua biblioteca.</p>
      
      <form class="login-form" onsubmit="event.preventDefault(); alert('Login demonstrativo realizado!');">
        <div class="form-group">
          <label for="email">E-mail ou Usuário</label>
          <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
        </div>
        
        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Digite sua senha" required>
        </div>

        <button type="submit" class="btn-login">Entrar</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 - Biblioteca de Jogos & Platinas. Todos os direitos reservados.</p>
  </footer>
</body>
</html>
